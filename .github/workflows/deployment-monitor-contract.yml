name: Deployment monitor contract
on:
  pull_request:
    paths:
      - .github/deployment-monitor.json
      - .github/workflows/deployment-monitor-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The shared reusable validator (formerly neophilism/Development-Deployment-Monitor)
  # is not available under Galinsky-Labs. Until it is, run a local, non-blocking
  # shape check so this contract never blocks merges on a missing upstream repo.
  contract:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment-monitor.json shape (local fallback)
        run: |
          node -e '
            const c = JSON.parse(require("fs").readFileSync(".github/deployment-monitor.json", "utf8"));
            const ok = c.schema_version === 1 && c.repository === process.env.GITHUB_REPOSITORY &&
              c.budget && c.budget.monthly_usd_max === 0 && c.budget.allow_billable_fallback === false &&
              Array.isArray(c.deployments);
            if (!ok) { console.error("deployment-monitor.json contract mismatch"); process.exit(1); }
            console.log("deployment-monitor.json ok for " + c.repository);
          '
