name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run prisma:validate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Live multi-role prototype E2E
        env:
          NODE_ENV: production
          RAM_DATA_BACKEND: prototype
          RAM_DEMO_AUTH_ENABLED: "true"
          RAM_PUBLIC_ONBOARDING_ENABLED: "false"
          AUTH_SECRET: ram-ci-e2e-secret-that-is-long-enough-2026
          RAM_MAX_MUTATION_BYTES: "1048576"
          RAM_E2E_BASE_URL: http://127.0.0.1:3117
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3117 > /tmp/ram-e2e.log 2>&1 &
          server_pid=$!
          trap 'cat /tmp/ram-e2e.log; kill "$server_pid" 2>/dev/null || true' EXIT
          npm run e2e:prototype


  postgres-integration:
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ram_marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ram_marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ram_marketplace
      RAM_DATA_BACKEND: postgres
      RAM_DEMO_AUTH_ENABLED: "true"
      RAM_PUBLIC_ONBOARDING_ENABLED: "false"
      AUTH_SECRET: ram-ci-postgres-secret-that-is-long-enough-2026
      RAM_IDENTITY_ASSERTION_SECRET: ram-ci-identity-assertion-secret-value-2026
      RAM_IDENTITY_ALLOWED_PROVIDERS: ci-idp
      RAM_IDENTITY_LOGIN_URL: https://identity.example.test/login
      RAM_IDENTITY_REQUIRE_MFA: "true"
      RAM_PAYMENT_GATEWAY_NAME: ci-gateway
      RAM_PAYMENT_GATEWAY_URL: http://127.0.0.1:4119
      RAM_PAYMENT_GATEWAY_SECRET: ram-ci-payment-gateway-secret-value-2026
      RAM_PAYMENT_GATEWAY_ALLOW_INSECURE_LOCAL: "true"
      RAM_MONITORING_ENABLED: "true"
      RAM_MONITORING_RUN_TOKEN: ram-ci-monitoring-run-token-value-2026
      RAM_MONITORING_ALERT_WEBHOOK_URL: http://127.0.0.1:4120/alerts
      RAM_MONITORING_ALERT_WEBHOOK_SECRET: ram-ci-monitoring-alert-secret-value-2026
      RAM_MONITORING_ALLOW_INSECURE_LOCAL: "true"
      RAM_MONITORING_PAYMENT_UNKNOWN_MINUTES: "1"
      RAM_MONITORING_PAYMENT_PROCESSING_MINUTES: "5"
      RAM_MONITORING_DISPUTE_HOURS: "1"
      RAM_MONITORING_PICKUP_HOURS: "1"
      RAM_MONITORING_ORG_VERIFICATION_HOURS: "1"
      RAM_MONITORING_MAX_RUN_AGE_MINUTES: "15"
      RAM_OIDC_ISSUER: http://127.0.0.1:4121
      RAM_OIDC_CLIENT_ID: ci-client
      RAM_OIDC_CLIENT_SECRET: ci-oidc-client-secret
      RAM_OIDC_REDIRECT_URI: http://127.0.0.1:3118/api/session/oidc/callback
      RAM_OIDC_PROVIDER_NAME: ci-oidc
      RAM_DIAGNOSTICS_PROVIDER_NAME: ci-lab
      RAM_DIAGNOSTICS_WEBHOOK_SECRET: ram-ci-diagnostics-webhook-secret-value-2026
      RAM_MAX_MUTATION_BYTES: "1048576"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --include=dev
      - name: Deploy committed migrations to empty PostgreSQL
        run: npm run db:migrate:deploy
      - name: Verify migration status
        run: npm run db:migrate:status
      - name: Verify database/schema drift is empty
        run: npm run db:migrate:drift
      - name: Seed controlled PostgreSQL E2E identities
        run: npm run db:seed:e2e
      - name: Build production application
        run: npm run build
      - name: Live PostgreSQL transaction, identity, payment and monitoring lifecycle E2E
        env:
          RAM_E2E_BASE_URL: http://127.0.0.1:3118
        run: |
          npm run payments:fake-gateway > /tmp/ram-payment-gateway.log 2>&1 &
          gateway_pid=$!
          npm run monitoring:fake-alert > /tmp/ram-monitoring-alert.log 2>&1 &
          alert_pid=$!
          npm run identity:fake-oidc > /tmp/ram-oidc.log 2>&1 &
          oidc_pid=$!
          npm run start -- --hostname 127.0.0.1 --port 3118 > /tmp/ram-postgres-e2e.log 2>&1 &
          server_pid=$!
          trap 'cat /tmp/ram-postgres-e2e.log; cat /tmp/ram-payment-gateway.log; cat /tmp/ram-monitoring-alert.log; kill "$server_pid" "$gateway_pid" "$alert_pid" "$oidc_pid" 2>/dev/null || true' EXIT
          npm run e2e:live
          npm run e2e:identity
          npm run e2e:payments
          npm run e2e:monitoring
          npm run e2e:phase3
          npm run e2e:oidc
          npm run e2e:scale
      - name: Stripe adapter E2E against a mocked Stripe API
        env:
          RAM_PAYMENT_GATEWAY_NAME: ""
          RAM_PAYMENT_GATEWAY_URL: ""
          RAM_PAYMENT_GATEWAY_SECRET: ""
          RAM_STRIPE_SECRET_KEY: sk_test_ciFakeStripeKey000000000000
          RAM_STRIPE_WEBHOOK_SECRET: whsec_ciFakeStripeWebhookSecret00000000
          RAM_STRIPE_API_BASE: http://127.0.0.1:4122
          RAM_STRIPE_E2E_BASE_URL: http://127.0.0.1:3119
        run: |
          npm run payments:fake-stripe > /tmp/ram-fake-stripe.log 2>&1 &
          stripe_pid=$!
          npm run start -- --hostname 127.0.0.1 --port 3119 > /tmp/ram-stripe-e2e.log 2>&1 &
          server_pid=$!
          trap 'cat /tmp/ram-stripe-e2e.log; cat /tmp/ram-fake-stripe.log; kill "$server_pid" "$stripe_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3119/api/health/live >/dev/null && break; sleep 1; done
          npm run e2e:stripe
      - name: Verify PostgreSQL dump and restore
        env:
          PGPASSWORD: postgres
        run: |
          # Use the service container's own client binaries so dump/restore
          # versions always match the server (the runner's newer pg_dump emits
          # settings such as transaction_timeout that older servers reject).
          cid="${{ job.services.postgres.id }}"
          docker exec "$cid" pg_dump -U postgres -d ram_marketplace --format=custom --no-owner --no-acl --file=/tmp/ram-marketplace.dump
          docker exec "$cid" createdb -U postgres ram_restore
          docker exec "$cid" pg_restore -U postgres -d ram_restore --no-owner --no-acl --exit-on-error /tmp/ram-marketplace.dump

          for table in Organization User Membership ExternalIdentity IdentityAssertionUse OrganizationVerification OrganizationPaymentProfile AnimalCase ResearchNeed Order FinancialSettlement FinancialLedgerEntry PaymentExecution PaymentWebhookReceipt OperationalIncident MonitoringRun AlertDelivery PilotGateVerification ComplianceRuleDraftRevision ComplianceRulePublication OrganizationApiKey SupplierBatchImport DiagnosticReport PaymentReconciliationRun JurisdictionActivation BuyerProcurementPolicy PurchaseOrder AuditEvent; do
            source_count=$(psql -h 127.0.0.1 -U postgres -d ram_marketplace -Atc "SELECT count(*) FROM \"$table\";")
            restore_count=$(psql -h 127.0.0.1 -U postgres -d ram_restore -Atc "SELECT count(*) FROM \"$table\";")
            test "$source_count" = "$restore_count"
          done

          source_migrations=$(psql -h 127.0.0.1 -U postgres -d ram_marketplace -Atc 'SELECT count(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL;')
          restore_migrations=$(psql -h 127.0.0.1 -U postgres -d ram_restore -Atc 'SELECT count(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL;')
          test "$source_migrations" = "$restore_migrations"
          test "$restore_migrations" -ge 1

          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/ram_restore npm run db:migrate:status
